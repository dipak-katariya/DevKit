name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Windows)
    # DevKit encrypts the PAT with DPAPI and its file-permission tests need NTFS, so it is tested on Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to the commit of a release, which nobody can move as a tag can be moved; Dependabot raises them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse committed settings files
        shell: pwsh
        run: |
          $tracked = git ls-files | Where-Object { $_ -match '(^|/)usersettings\.json' }
          if ($tracked) {
            Write-Error "Settings files hold a PAT and must never be committed: $($tracked -join ', ')"
            exit 1
          }

      - name: Refuse committed secrets
        shell: pwsh
        run: |
          # Certificates and keys by name; private keys and Azure DevOps tokens (52 characters of base32) by content.
          $found = @(git ls-files | Where-Object { $_ -match '\.(pfx|p12|pem|key|snk)$' })
          $found += @(git grep -I -l -E 'BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY' -- .)
          $found += @(git grep -I -l -E '(^|[^a-z2-7])[a-z2-7]{52}([^a-z2-7]|$)' -- .)
          if ($found) {
            Write-Error "These files look like they hold a secret: $($found -join ', ')"
            exit 1
          }
          exit 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DevKit.sln

      - name: Refuse packages with known vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list DevKit.sln package --vulnerable --include-transitive 2>&1 | Out-String
          $report
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($report -match 'has the following vulnerable packages') {
            Write-Error 'A package with a known vulnerability is in use; update it.'
            exit 1
          }
          exit 0

      - name: Build (warnings are errors)
        run: dotnet build DevKit.sln -c Release --no-restore -warnaserror

      - name: Test with coverage
        run: >
          dotnet test DevKit.sln -c Release --no-build
          --collect "Code Coverage;Format=cobertura"
          --results-directory TestResults
          --logger trx

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults

  sonar-analyzer:
    name: SonarAnalyzer report (does not block)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build with SonarAnalyzer
        shell: pwsh
        run: |
          dotnet build DevKit.sln -c Release -p:DevKitSonarAnalyzer=true --no-incremental 2>&1 | Tee-Object -FilePath sonar-build.log
          $issues = Select-String -Path sonar-build.log -Pattern 'warning S\d+' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
          "SonarAnalyzer found $($issues.Count) issues." | Tee-Object -FilePath sonar-summary.txt
          $issues | Add-Content sonar-summary.txt

      - name: Upload the SonarAnalyzer report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-analyzer
          path: sonar-summary.txt
